name: CI

# À chaque push / pull request :
#   1. lint (ruff) et tests unitaires (données synthétiques, aucun secret requis) ;
#   2. récupération des données/modèles versionnés par DVC depuis DagsHub (`dvc pull`),
#      évaluation du modèle en service sur le jeu de test (porte de qualité : D8, D9,
#      calibration, base de connaissance, reproduction de metrics.json ; rapport en artefact),
#      build de l'image API et test de fumée /ready (modèles v2 chargés) ;
#   3. sur un push sur main uniquement, si tout est vert : publication de l'image testée sur
#      GitHub Container Registry, taggée par commit et `latest` (déploiement continu).
#      Étape 2 ignorée tant que le secret DAGSHUB_TOKEN n'est pas configuré.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - run: python -m pytest -q
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  docker:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # publication sur ghcr.io avec le GITHUB_TOKEN du run
    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret DagsHub absent -- étape ignorée
        if: env.DAGSHUB_TOKEN == ''
        run: echo "Configurer le secret DAGSHUB_TOKEN dans Settings > Secrets > Actions."
      - uses: actions/setup-python@v5
        if: env.DAGSHUB_TOKEN != ''
        with:
          python-version: "3.13"
          cache: pip
      - name: dvc pull (données + modèles depuis DagsHub)
        if: env.DAGSHUB_TOKEN != ''
        run: |
          pip install "dvc[s3]==3.67.1"
          dvc remote modify origin --local access_key_id "$DAGSHUB_TOKEN"
          dvc remote modify origin --local secret_access_key "$DAGSHUB_TOKEN"
          dvc pull
      - name: Évaluation du modèle en service (porte de qualité)
        if: env.DAGSHUB_TOKEN != ''
        run: |
          pip install -r requirements.txt
          python scripts/evaluer_modele.py --sortie reports/evaluation_modele.json
      - name: Rapport d'évaluation
        if: always() && env.DAGSHUB_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-modele
          path: reports/evaluation_modele.json
          if-no-files-found: warn
      - name: Build image API + test de fumée
        if: env.DAGSHUB_TOKEN != ''
        run: |
          docker build --target runtime -t churn-api:ci .
          docker run -d --name api -p 8000:8000 -e API_KEY=ci-key -e MODEL_DIR=/app/data/model_v2 churn-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/ready && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - name: Publication de l'image sur GHCR (push sur main)
        if: env.DAGSHUB_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for TAG in "${GITHUB_SHA::12}" latest; do
            docker tag churn-api:ci "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          done
          echo "Image publiée : $IMAGE:${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"
